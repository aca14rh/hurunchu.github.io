<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四屏粘黏滚动效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        .container {
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .section {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            color: white;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }
        .section .image-container {
            width: 80%;
            height: 50%;
            position: relative;
            max-width: 800px;
            margin: 20px 0 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
        }
        .section .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .image-caption {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -25px;
            font-weight: 300;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            width: 100%;
        }
        #section1 { background-color: #702828; }
        #section2 { background-color: #702828; transform: translateY(100%); }
        #section3 { background-color: #702828; transform: translateY(200%); }
        #section4 { background-color: #702828; transform: translateY(300%); }

        /* 导航点样式 */
        .nav-dots {
            position: fixed;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }
        .nav-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .nav-dot:hover {
            background-color: rgba(255, 255, 255, 0.8);
        }
        .nav-dot.active {
            background-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.2);
        }

        /* 密码验证层样式 */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        .password-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .password-title {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .password-input {
            display: flex;
            gap: 10px;
        }
        .digit-input {
            width: 40px;
            height: 50px;
            border: 2px solid #fff;
            background: transparent;
            border-radius: 8px;
            color: white;
            font-size: 24px;
            text-align: center;
            outline: none;
        }
        .digit-input:focus {
            border-color: #3498db;
        }
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            height: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        /* 主内容区域样式 */
        .main-content {
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .main-content.visible {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- 密码验证层 -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="password-container">
            <div class="password-title">请输入6位密码</div>
            <div class="password-input">
                <input type="password" maxlength="1" class="digit-input" pattern="[0-9]*" inputmode="numeric">
                <input type="password" maxlength="1" class="digit-input" pattern="[0-9]*" inputmode="numeric">
                <input type="password" maxlength="1" class="digit-input" pattern="[0-9]*" inputmode="numeric">
                <input type="password" maxlength="1" class="digit-input" pattern="[0-9]*" inputmode="numeric">
                <input type="password" maxlength="1" class="digit-input" pattern="[0-9]*" inputmode="numeric">
                <input type="password" maxlength="1" class="digit-input" pattern="[0-9]*" inputmode="numeric">
            </div>
            <div class="error-message" id="errorMessage">密码错误，请重试</div>
        </div>
    </div>

    <!-- 主内容区域 -->
    <div class="main-content" id="mainContent">
        <div class="container">
            <div class="section" id="section1">
                <div class="image-container">
                    <img src="https://picsum.photos/800/600" alt="Random Image 1">
                    <div class="image-caption">这是第一张图片的说明文字</div>
                </div>
            </div>
            <div class="section" id="section2">
                <div class="image-container">
                    <img src="https://picsum.photos/600/800" alt="Random Image 2">
                    <div class="image-caption">这是第二张图片的说明文字</div>
                </div>
            </div>
            <div class="section" id="section3">
                <div class="image-container">
                    <img src="https://picsum.photos/800/800" alt="Random Image 3">
                    <div class="image-caption">这是第三张图片的说明文字</div>
                </div>
            </div>
            <div class="section" id="section4">
                <div class="image-container">
                    <img src="https://picsum.photos/900/600" alt="Random Image 4">
                    <div class="image-caption">这是第四张图片的说明文字</div>
                </div>
            </div>
        </div>
        <div class="nav-dots"></div>
    </div>

    <script>
        // 密码验证相关代码
        const correctPassword = '123456'; // 设置正确的密码
        const passwordOverlay = document.getElementById('passwordOverlay');
        const mainContent = document.getElementById('mainContent');
        const errorMessage = document.getElementById('errorMessage');
        const digitInputs = document.querySelectorAll('.digit-input');
        let currentInput = 0;

        // 自动聚焦第一个输入框
        digitInputs[0].focus();

        // 处理输入
        digitInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value) {
                    if (index < digitInputs.length - 1) {
                        digitInputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    digitInputs[index - 1].focus();
                }
            });

            // 防止粘贴多个字符
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, 1);
                if (/[0-9]/.test(pastedData)) {
                    input.value = pastedData;
                    if (index < digitInputs.length - 1) {
                        digitInputs[index + 1].focus();
                    }
                }
            });
        });

        // 验证密码
        function checkPassword() {
            const enteredPassword = Array.from(digitInputs).map(input => input.value).join('');
            if (enteredPassword === correctPassword) {
                passwordOverlay.style.opacity = '0';
                mainContent.classList.add('visible');
                setTimeout(() => {
                    passwordOverlay.style.display = 'none';
                }, 500);
                return true;
            } else {
                errorMessage.style.opacity = '1';
                digitInputs.forEach(input => {
                    input.value = '';
                });
                digitInputs[0].focus();
                setTimeout(() => {
                    errorMessage.style.opacity = '0';
                }, 2000);
                return false;
            }
        }

        // 监听最后一个输入框的变化
        digitInputs[digitInputs.length - 1].addEventListener('input', () => {
            const allFilled = Array.from(digitInputs).every(input => input.value.length === 1);
            if (allFilled) {
                checkPassword();
            }
        });

        // 初始化变量
        let currentSection = 0;
        let isScrolling = false;
        let lastScrollTime = Date.now();
        const scrollCooldown = 800; // 滚动冷却时间（毫秒）
        const wheelThreshold = 50; // 滚轮事件阈值

        // 更新导航点
        function updateNavDots() {
            const dots = document.querySelectorAll('.nav-dot');
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSection);
            });
        }

        // 滚动到指定部分
        function scrollToSection(index) {
            if (isScrolling || index === currentSection || index < 0 || index > 3) return;
            
            const now = Date.now();
            if (now - lastScrollTime < scrollCooldown) return;
            
            isScrolling = true;
            lastScrollTime = now;
            currentSection = index;

            const sections = document.querySelectorAll('.section');
            sections.forEach((section, i) => {
                section.style.transform = `translateY(${(i - currentSection) * 100}%)`;
            });

            updateNavDots();
            
            setTimeout(() => {
                isScrolling = false;
            }, scrollCooldown);
        }

        // 处理滚轮事件
        let wheelAccumulator = 0;
        function handleWheel(event) {
            event.preventDefault();
            
            if (isScrolling) return;
            
            wheelAccumulator += event.deltaY;
            
            if (Math.abs(wheelAccumulator) >= wheelThreshold) {
                if (wheelAccumulator > 0) {
                    scrollToSection(currentSection + 1);
                } else {
                    scrollToSection(currentSection - 1);
                }
                wheelAccumulator = 0;
            }
        }

        // 处理触摸事件
        let touchStartY = 0;
        let touchEndY = 0;
        const touchThreshold = 50;

        function handleTouchStart(event) {
            touchStartY = event.touches[0].clientY;
        }

        function handleTouchMove(event) {
            event.preventDefault();
        }

        function handleTouchEnd(event) {
            if (isScrolling) return;
            
            touchEndY = event.changedTouches[0].clientY;
            const touchDiff = touchEndY - touchStartY;
            
            if (Math.abs(touchDiff) >= touchThreshold) {
                if (touchDiff < 0) {
                    scrollToSection(currentSection + 1);
                } else {
                    scrollToSection(currentSection - 1);
                }
            }
        }

        // 初始化
        document.addEventListener('wheel', handleWheel, { passive: false });
        document.addEventListener('touchstart', handleTouchStart);
        document.addEventListener('touchmove', handleTouchMove, { passive: false });
        document.addEventListener('touchend', handleTouchEnd);

        // 键盘事件
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
                scrollToSection(currentSection + 1);
            } else if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
                scrollToSection(currentSection - 1);
            }
        });

        // 初始化导航点
        const navDots = document.querySelector('.nav-dots');
        for (let i = 0; i < 4; i++) {
            const dot = document.createElement('div');
            dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
            dot.addEventListener('click', () => scrollToSection(i));
            navDots.appendChild(dot);
        }
    </script>
</body>
</html>
