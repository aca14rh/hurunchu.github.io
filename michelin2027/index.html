const CAT_BY_ID = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

function catColor(id){ return CAT_BY_ID[id]?.color || "#999"; }
function catName(id){ return CAT_BY_ID[id]?.name || ""; }

// ---------- 数据栏 ----------
function renderStats(){
  const total = RESTAURANTS.length;
  const row = document.getElementById('statsRow');
  let html = '';
  for (const c of CATEGORIES){
    html += `<div class="stat" data-cat="${c.id}"><span class="n">${c.count}</span><span class="l">${c.name}</span></div>`;
  }
  html += `<div class="stat" data-cat="all" style="background:#1a1a1a"><span class="n">${total}</span><span class="l">总 计</span></div>`;
  row.innerHTML = html;
}

// ---------- 筛选 ----------
function renderFilter(){
  const bar = document.getElementById('filterBar');
  CATEGORIES.forEach(c => {
    const el = document.createElement('label');
    el.dataset.id = c.id;
    el.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.name} ${c.count}`;
    bar.appendChild(el);
  });
  bar.addEventListener('click', e => {
    const label = e.target.closest('label');
    if (!label) return;
    bar.querySelectorAll('label').forEach(x => x.classList.remove('active'));
    label.classList.add('active');
    const id = label.dataset.id;
    const filtered = id === 'all' ? RESTAURANTS : RESTAURANTS.filter(r => r.category_id === Number(id));
    renderList(filtered);
    markers.forEach(m => {
      const show = id === 'all' || m.r.category_id === Number(id);
      const icon = m.getIcon();
      if (show) m.addTo(map); else map.removeLayer(m);
      icon.options.opacity = show ? 1 : 0;
    });
  });
}

// ---------- 列表 ----------
function renderList(data){
  const sorted = [...data].sort((a, b) => b.category_id - a.category_id);
  const html = sorted.map((r, idx) => `
    <div class="list-item" data-idx="${idx}">
      <span class="dot" style="background:${catColor(r.category_id)}"></span>
      <span class="nm">${r.name}</span>
      ${r.promoted ? '<span class="badge">升星</span>' : ''}
      ${r.new ? '<span class="badge new">新晋</span>' : ''}
      ${r.green_star ? '<span class="badge green">绿星</span>' : ''}
    </div>
  `).join('');
  const box = document.getElementById('listContainer');
  box.innerHTML = `<h3>餐厅列表 <span class="en">${data.length} RESTAURANTS</span></h3><div class="list-grid">${html}</div>`;
  // bind clicks（移动端：先把地图带回视口，再飞行并弹出详情，保证“点列表看地图”联动可见）
  box.querySelectorAll('.list-item').forEach(el => {
    el.addEventListener('click', () => {
      const r = sorted[Number(el.dataset.idx)];
      const m = markers.find(x => x.r === r);
      const go = () => {
        map.flyTo([r.lat, r.lng], 14, { duration: 0.8 });
        if (m) m.openPopup();
      };
      if (window.innerWidth <= 900){
        const mc = document.getElementById('mapCard');
        mc.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setTimeout(go, 480);
      } else {
        go();
      }
    });
  });
}

// 改用【本地预烘焙好的高德底图】作为 imageOverlay —— 不再依赖任何运行时第三方瓦片请求，
// 彻底避免预览 iframe 拦截/限流第三方图片导致的白块。坐标 GCJ-02，四角精确对齐。
const OVERLAY_BOUNDS = L.latLngBounds([30.486551, 103.886719], [30.789037, 104.150391]);
L.imageOverlay('chengdu_base_z13.png', OVERLAY_BOUNDS, {
  opacity: 1,
  zIndex: 0,
  className: 'base-overlay'
}).addTo(map);

// 品牌 logo 标签
const brandIcon = L.divIcon({
  className: '',
  html: `<div style="font-family:'Noto Sans SC';font-size:10px;color:#6e1f1f;background:rgba(253,246,227,.92);padding:3px 8px;border:1px solid #b8862f;border-radius:3px;letter-spacing:2px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15);">寻味蓉城 · 2027</div>`,
  iconSize: [70, 18],
  iconAnchor: [-10, 50]
});
L.marker([30.7000, 104.1130], { icon: brandIcon }).addTo(map);

// 自定义 marker
function makeIcon(r){
  const cls = 'cat' + r.category_id;
  let label = '';
  if (r.category_id === 3) label = '★★★';
  else if (r.category_id === 2) label = '★★';
  else if (r.category_id === 1) label = '★';
  else if (r.category_id === 0) label = 'B';
  else label = '·';
  return L.divIcon({
    className: '',
    html: `<div class="marker-icon ${cls}">${label}</div>`,
    iconSize: r.category_id >= 1 ? [r.category_id === 3 ? 30 : r.category_id === 2 ? 26 : 22, r.category_id === 3 ? 30 : r.category_id === 2 ? 26 : 22] : [r.category_id === 0 ? 16 : 14, r.category_id === 0 ? 16 : 14],
    iconAnchor: [r.category_id === 3 ? 15 : r.category_id === 2 ? 13 : r.category_id === 1 ? 11 : r.category_id === 0 ? 8 : 7,
                 r.category_id === 3 ? 15 : r.category_id === 2 ? 13 : r.category_id === 1 ? 11 : r.category_id === 0 ? 8 : 7]
  });
}

const markers = [];
RESTAURANTS.forEach(r => {
  const icon = makeIcon(r);
  const m = L.marker([r.lat, r.lng], { icon });
  m.r = r;
  const badges = [];
  if (r.promoted) badges.push('<span class="badge">升星</span>');
  if (r.new) badges.push('<span class="badge new">新晋</span>');
  if (r.green_star) badges.push('<span class="badge green">绿星</span>');
  m.bindPopup(`
    <div class="popup">
      <h4>${r.name}<span class="en">${r.en}</span></h4>
      <span class="cat" style="background:${catColor(r.category_id)}">${catName(r.category_id)}</span>
      <div class="addr">${r.address}</div>
      <div class="meta">${badges.join(' ')}</div>
    </div>
  `, { maxWidth: 280 });
  m.addTo(map);
  markers.push(m);
});

// 全部标注后调整地图视野：精确铺满整张预烘焙底图，边缘不留灰线
const fg = L.featureGroup(markers);
function fillView(){
  map.fitBounds(OVERLAY_BOUNDS, { padding: [0, 0], animate: false });
}

// ---------- 预览面板尺寸校定 ----------
function reflow(){
  placeZoom();
  map.invalidateSize(false);
  fillView();
}
setTimeout(reflow, 40);
setTimeout(reflow, 200);
setTimeout(reflow, 500);
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => reflow()).observe(document.getElementById('map'));
}
window.addEventListener('resize', reflow);

// 底图为本地图片，加载完成后隐藏提示并聚焦视野
const tileHint = document.getElementById('tileHint');
setTimeout(() => { tileHint.classList.add('hide'); }, 1200);
setTimeout(() => { fillView(); map.invalidateSize(false); }, 80);

// 初始化
renderStats();
renderFilter();
renderList(RESTAURANTS);
</script>

</body>
</html>
